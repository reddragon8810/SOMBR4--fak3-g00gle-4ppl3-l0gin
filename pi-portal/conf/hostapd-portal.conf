# Esempio di configurazione hostapd (setup.sh genera /etc/hostapd/hostapd-portal.conf)
# Rete AP aperta, stesso canale dell'uplink (radio singola CYW43455).
interface=ap0
driver=nl80211
ssid=Starbucks_Free_WiFi
hw_mode=g
channel=6
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0

