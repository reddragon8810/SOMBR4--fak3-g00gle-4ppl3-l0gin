# Esempio di configurazione hostapd (setup.sh genera /etc/hostapd/hostapd-portal.conf)
#
# Radio singola (CYW43455): l'AP DEVE stare sulla stessa banda e sullo stesso
# canale dell'uplink. Se l'hotspot e' a 5 GHz serve hw_mode=a (setup.sh lo rileva
# da solo; qui sotto l'esempio e' 2.4 GHz).
interface=ap0
driver=nl80211
ssid=Starbucks_Free_WiFi
hw_mode=g
channel=6
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0

# Opzionale: WPA2 invece della rete aperta
# wpa=2
# wpa_passphrase=PasswordLunga
# wpa_key_mgmt=WPA-PSK
# rsn_pairwise=CCMP

# Variante 5 GHz (stessa banda dell'hotspot):
# hw_mode=a
# channel=36
