# Esempio della config dnsmasq del portale.
#
# NON va in /etc/dnsmasq.d/: sta in un file suo (/etc/dnsmasq-portal.conf) e
# viene avviata da dnsmasq-portal.service con `dnsmasq -C /etc/dnsmasq-portal.conf`.
# Cosi' Pi-hole non la legge mai e il dirottamento DNS non tocca la rete di casa.
#
# - ascolta SOLO su ap0 (la rete del portale)
# - ogni dominio risolve con l'IP del Pi (il portale si apre su qualunque URL)
# - il DHCP annuncia un DNS pubblico: i client non ancora sbloccati vengono
#   comunque dirottati qui via iptables, ma dopo il login risolvono davvero
interface=ap0
bind-interfaces
dhcp-authoritative
dhcp-range=10.3.0.100,10.3.0.250,12h
dhcp-option=option:router,10.3.0.1
dhcp-option=option:dns-server,1.1.1.1,8.8.8.8
address=/#/10.3.0.1
no-resolv
