# Esempio di configurazione dnsmasq (setup.sh genera /etc/dnsmasq.d/starbucks-portal.conf)
# DHCP + DNS sul solo ap0; ogni dominio viene risolto con l'IP del Pi
# (captive portal: qualunque URL digitato apre il portale).
interface=ap0
bind-interfaces
dhcp-range=10.3.0.100,10.3.0.250,12h
dhcp-option=option:router,10.3.0.1
dhcp-option=option:dns-server,10.3.0.1
address=/#/10.3.0.1
no-resolv
